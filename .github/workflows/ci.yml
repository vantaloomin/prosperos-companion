name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run; every push to main or a release branch
# still runs in full.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The app and its tooling live in Program/; Windows/ and Mac/ hold only the double-click scripts.
defaults:
  run:
    working-directory: Program

jobs:
  changes:
    # What a pull request has to run. A push to main or a release branch, and a pull request into main (a release
    # or a hotfix), run everything. Any other pull request runs less, so it is quicker to go green:
    #  - the install and MCP SDK jobs only when it touches what they test;
    #  - the backend tests on Linux only, without the tests marked slow (tests/conftest.py). Windows, macOS and
    #    the slow tests run once it is merged, on the push to its release branch;
    #  - no backend tests at all when it only touches the front end or the written docs.
    # A job skipped this way counts as passed for required checks.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      installers: ${{ steps.diff.outputs.installers }}
      mcp: ${{ steps.diff.outputs.mcp }}
      backend: ${{ steps.diff.outputs.backend }}
      full: ${{ steps.diff.outputs.full }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        shell: bash
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          INTO: ${{ github.base_ref }}
        run: |
          every='[{"os":"ubuntu-latest"},{"os":"macos-latest"},{"os":"windows-latest","shard":"1/3"},{"os":"windows-latest","shard":"2/3"},{"os":"windows-latest","shard":"3/3"}]'
          if [ "$EVENT" != pull_request ]; then
            echo installers=true >> "$GITHUB_OUTPUT"; echo mcp=true >> "$GITHUB_OUTPUT"
            echo backend=true >> "$GITHUB_OUTPUT"; echo full=true >> "$GITHUB_OUTPUT"; echo "matrix=$every" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          shared='^(\.github/workflows/ci\.yml|Program/requirements\.lock\.txt|Program/pyproject\.toml)$'
          installers='^(Windows/|Mac/|Program/scripts/(windows|macos)/|Program/package(-lock)?\.json$|Program/companion/(launch|main)\.py$)'
          mcp='^(Program/companion/mcp/|Program/tests/test_mcp_sdk_interop\.py$)'
          if grep -Eq "$shared|$installers" <<< "$changed"; then echo installers=true; else echo installers=false; fi >> "$GITHUB_OUTPUT"
          if grep -Eq "$shared|$mcp" <<< "$changed"; then echo mcp=true; else echo mcp=false; fi >> "$GITHUB_OUTPUT"
          # Files no backend test reads: the front end (but not the Draft Table's, which tests/test_draft_table.py
          # reads) and the written docs.
          light='^(Program/(src/|tests/ui/|public/|eslint\.config\.js$|tsconfig[^/]*\.json$|vite\.config\.ts$)|README\.md$|CHANGELOG\.md$|Program/docs/.*\.md$)'
          draft='^Program/src/(features/draft/|draft\.tsx$)'
          if [ "$INTO" = main ] || grep -Eq "$shared" <<< "$changed"; then full=true; else full=false; fi
          if [ "$full" = true ] || grep -Ev "$light" <<< "$changed" | grep -q . || grep -Eq "$draft" <<< "$changed"; then backend=true; else backend=false; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"; echo "backend=$backend" >> "$GITHUB_OUTPUT"
          if [ "$full" = true ]; then echo "matrix=$every"; else echo 'matrix=[{"os":"ubuntu-latest"}]'; fi >> "$GITHUB_OUTPUT"
          echo "full=$full backend=$backend"

  backend:
    # Windows runs the suite several times slower than Linux, so its tests are split over three jobs to stay well
    # inside the time limit (COMPANION_TEST_SHARD, tests/conftest.py). Now and then a Windows runner is about four
    # times slower again (one third of the suite in 28 minutes, the other two in 8), so the limit leaves room for it.
    # Which systems run, and whether at all, is decided by the changes job above.
    name: backend (${{ matrix.os }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        # Spread over the runner's cores (pytest-xdist); each test has its own temporary workspace. Those go in
        # runner.temp: on Windows TEMP is on the runner's slow C: drive, and runner.temp is on D:.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          COMPANION_TEST_SHARD: ${{ matrix.shard }}
          # An ordinary pull request leaves out the tests marked slow; everything else runs them.
          PYTEST_ADDOPTS: ${{ needs.changes.outputs.full != 'true' && '-m "not slow"' || '' }}
        run: python -m pytest -q -n auto --durations=50 --durations-min=10
      - name: Check city data
        run: python -m companion.world.check

  mcp-interop:
    # The MCP client against servers built with the official MCP Python SDK (not an app dependency).
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Install the MCP SDK in its own environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdk"
          if [ -x "$RUNNER_TEMP/sdk/Scripts/python.exe" ]; then sdk="$RUNNER_TEMP/sdk/Scripts/python.exe"; else sdk="$RUNNER_TEMP/sdk/bin/python"; fi
          "$sdk" -m pip install "mcp==2.3.0" "uvicorn==0.54.0"
          echo "MCP_SDK_PYTHON=$sdk" >> "$GITHUB_ENV"
      - name: Test against the SDK's servers
        run: python -m pytest -q tests/test_mcp_sdk_interop.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Program/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  windows-install:
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install with the Windows installer
        shell: pwsh
        run: .\scripts\windows\install.ps1 -NoPause
      - name: Launch and answer on the Companion port
        shell: pwsh
        env:
          COMPANION_DATA_DIR: ${{ runner.temp }}\companion-data
        run: |
          $app = Start-Process -FilePath .\.venv\Scripts\python.exe -ArgumentList '-m', 'companion.launch', '--no-browser' -PassThru -NoNewWindow
          try {
            $health = $null
            foreach ($attempt in 1..60) {
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8775/api/health' -TimeoutSec 2; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $health -or $health.app_id -ne 'prospero-companion') { throw 'The Companion did not answer on port 8775.' }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8775/' -UseBasicParsing
            if ($page.Content -notmatch 'Prospero Companion') { throw 'The interface was not served.' }
            Write-Host "Launched $($health.app_id) $($health.version) and served the interface."
          } finally { Stop-Process -Id $app.Id -Force }
      - name: Test the checkout helpers
        shell: powershell
        env:
          COMPANION_DATA_DIR: ${{ runner.temp }}\companion-helpers-data
        run: .\scripts\windows\helpers-test.ps1

  macos-install:
    # Nobody on the team has a Mac, so this is the macOS scripts' only test. No setup-python or
    # setup-node: install.command has to find (or install with Homebrew) what a Mac already has.
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The .command files are executable
        run: for f in ../Mac/*.command; do test -x "$f" || { echo "$f is not executable"; exit 1; }; done
      - name: Install with install.command
        run: ../Mac/install.command
      - name: Check the install
        run: ../Mac/install.command --check-only
      - name: Test the checkout scripts
        env:
          COMPANION_DATA_DIR: ${{ runner.temp }}/companion-data
        run: /bin/bash --version | head -n 1 && ./scripts/macos/helpers-test.sh
