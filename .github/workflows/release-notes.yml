name: Release notes

# Replaces the notes of an already published release with Program/docs/releases/<tag>.md from main,
# for example to warn about a bug in an older version. Nothing else about the release changes.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Releases to update, separated by spaces (for example "v0.1.0 v0.1.1")
        type: string
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: Program/docs/releases
      - name: Update the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "Release notes are updated from main only." >&2; exit 1; fi
          for tag in $TAGS; do
            case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Not a release tag: $tag" >&2; exit 1 ;; esac
            notes="Program/docs/releases/$tag.md"
            test -f "$notes" || { echo "Missing $notes" >&2; exit 1; }
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            echo "Updated $tag"
          done
