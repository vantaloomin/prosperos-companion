<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#191816" />
    <meta name="application-name" content="Prospero Companion" />
    <meta name="description" content="A private companion with a life of its own, running on your computer." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Companion" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Prospero Companion</title>
    <!-- Shown only if the app never starts, as on a browser too old for it; the app replaces it. -->
    <style>
      .boot { opacity: 0; animation: boot-show 0s 6s forwards; margin: 0; padding: 32px 20px; font: 16px/1.5 system-ui, sans-serif; color: #e9e4dc; background: #191816; min-height: 100vh; box-sizing: border-box; }
      @keyframes boot-show { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><p class="boot">The Companion has not started in this browser. Reload the page. If it still does not open, update this browser or try another one.</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
