name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The app and its tooling live in Program/; Windows/ and Mac/ hold only the double-click scripts.
defaults:
  run:
    working-directory: Program

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Check city data
        run: python -m companion.world.check

  mcp-interop:
    # The MCP client against servers built with the official MCP Python SDK (not an app dependency).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Install the MCP SDK in its own environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdk"
          if [ -x "$RUNNER_TEMP/sdk/Scripts/python.exe" ]; then sdk="$RUNNER_TEMP/sdk/Scripts/python.exe"; else sdk="$RUNNER_TEMP/sdk/bin/python"; fi
          "$sdk" -m pip install "mcp==2.3.0" "uvicorn==0.54.0"
          echo "MCP_SDK_PYTHON=$sdk" >> "$GITHUB_ENV"
      - name: Test against the SDK's servers
        run: python -m pytest -q tests/test_mcp_sdk_interop.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Program/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  windows-install:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The layout-move test updates a copy from the last commit before the move.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install with the Windows installer
        shell: pwsh
        run: .\scripts\windows\install.ps1 -NoPause
      - name: Launch and answer on the Companion port
        shell: pwsh
        env:
          COMPANION_DATA_DIR: ${{ runner.temp }}\companion-data
        run: |
          $app = Start-Process -FilePath .\.venv\Scripts\python.exe -ArgumentList '-m', 'companion.launch', '--no-browser' -PassThru -NoNewWindow
          try {
            $health = $null
            foreach ($attempt in 1..60) {
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8775/api/health' -TimeoutSec 2; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $health -or $health.app_id -ne 'prospero-companion') { throw 'The Companion did not answer on port 8775.' }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8775/' -UseBasicParsing
            if ($page.Content -notmatch 'Prospero Companion') { throw 'The interface was not served.' }
            Write-Host "Launched $($health.app_id) $($health.version) and served the interface."
          } finally { Stop-Process -Id $app.Id -Force }
      - name: Test the checkout helpers
        shell: powershell
        env:
          COMPANION_DATA_DIR: ${{ runner.temp }}\companion-helpers-data
        run: .\scripts\windows\helpers-test.ps1
      - name: Update a copy from before the layout move
        shell: powershell
        env:
          COMPANION_DATA_DIR: ${{ runner.temp }}\companion-move-data
        run: .\scripts\windows\layout-move-test.ps1

  macos-install:
    # Nobody on the team has a Mac, so this is the macOS scripts' only test. No setup-python or
    # setup-node: install.command has to find (or install with Homebrew) what a Mac already has.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The .command files are executable
        run: for f in ../Mac/*.command; do test -x "$f" || { echo "$f is not executable"; exit 1; }; done
      - name: Install with install.command
        run: ../Mac/install.command
      - name: Check the install
        run: ../Mac/install.command --check-only
      - name: Test the checkout scripts
        env:
          COMPANION_DATA_DIR: ${{ runner.temp }}/companion-data
        run: /bin/bash --version | head -n 1 && ./scripts/macos/helpers-test.sh
